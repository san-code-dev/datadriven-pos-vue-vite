<style>
  #native-reloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 99999;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background-color: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #ffffff;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;

    opacity: 0;
    visibility: hidden;
    will-change: opacity, visibility;
    transition: opacity 0.2s linear, visibility 0.2s linear;
  }

  #native-reloader.active {
    opacity: 1;
    visibility: visible;
  }

  .native-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #10b981;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;

    /* Kunci ukuran & posisi spinner agar tidak memantul/bergeser */
    box-sizing: border-box;
    flex-shrink: 0;
    transform: translateZ(0);
    /* Paksakan render GPU khusus agar posisi stabil */
  }

  /* Reset margin dan kunci tinggi teks */
  #native-reloader p {
    margin: 16px 0 0 0;
    /* Ubah margin-top eksplisit tanpa memicu reflow */
    padding: 0;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
    height: 18px;
    /* Fixed height agar tidak merubah ukuran flex parent */
    box-sizing: border-box;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }
</style>

<body>
  <div id="app"></div>

  <div id="native-reloader">
    <div class="native-spinner"></div>
    <p class="loading-text">Memuat ulang halaman...</p>
  </div>

  <script>
    // Aktifkan class dengan opacity transition
    if (sessionStorage.getItem('is_reloading') === 'true') {
      // Tunda kemunculan loader selama 250ms
      window.__reloaderTimer = setTimeout(function () {
        var el = document.getElementById('native-reloader');
        if (el) el.classList.add('active');
      }, 500); // Hanya muncul jika load butuh waktu > 250ms
    }
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
