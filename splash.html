<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            user-select: none;
            -webkit-app-region: drag;
            /* Agar splashscreen bisa digeser */
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .loader {
            width: 150px;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress {
            width: 100%;
            height: 100%;
            background: #10b981;
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body>
    <div class="logo">R</div>
    <h2 style="margin:0; font-size: 18px; letter-spacing: 1px;">REVO-CORE</h2>
    <p style="margin: 4px 0 0; font-size: 12px; color: #64748b;">Memuat...</p>
    <div class="loader">
        <div class="progress"></div>
    </div>
</body>

</html>
